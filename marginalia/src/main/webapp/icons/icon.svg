<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Marginalia">
  <title>Marginalia</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3f8f"/>
      <stop offset="1" stop-color="#1e2150"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f1e6cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- page -->
  <g filter="url(#shadow)">
    <path d="M104 68h244l60 60v316a16 16 0 0 1-16 16H104a16 16 0 0 1-16-16V84a16 16 0 0 1 16-16z" fill="url(#paper)"/>
  </g>
  <!-- folded corner -->
  <path d="M348 68l60 60h-44a16 16 0 0 1-16-16z" fill="#e2d3b3"/>

  <!-- margin rule -->
  <line x1="196" y1="68" x2="196" y2="460" stroke="#c8553d" stroke-width="5" stroke-linecap="round" opacity=".85"/>

  <!-- body text lines -->
  <g stroke="#7a7466" stroke-width="12" stroke-linecap="round" opacity=".55">
    <line x1="226" y1="158" x2="372" y2="158"/>
    <line x1="226" y1="204" x2="384" y2="204"/>
    <line x1="226" y1="250" x2="352" y2="250"/>
    <line x1="226" y1="296" x2="384" y2="296"/>
    <line x1="226" y1="342" x2="338" y2="342"/>
    <line x1="226" y1="388" x2="376" y2="388"/>
  </g>

  <!-- marginal note: a story tree branching in the margin -->
  <g fill="none" stroke="#c8553d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M142 150V250"/>
    <path d="M142 214C142 262 112 276 112 318"/>
    <path d="M142 214C142 262 172 276 172 318"/>
  </g>
  <g fill="#c8553d">
    <circle cx="142" cy="150" r="17"/>
    <circle cx="112" cy="334" r="15"/>
    <circle cx="172" cy="334" r="15"/>
  </g>
  <circle cx="142" cy="214" r="9" fill="#fffaf0" stroke="#c8553d" stroke-width="6"/>

  <!-- highlight on the chosen line -->
  <rect x="216" y="282" width="180" height="28" rx="8" fill="#e8a33d" opacity=".28"/>
</svg>
