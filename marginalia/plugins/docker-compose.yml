# Builds all plugins in a container and copies the JARs into ./build:
#   docker compose -f marginalia/plugins/docker-compose.yml build
#   docker compose -f marginalia/plugins/docker-compose.yml run --rm plugins
# The image is the stage "plugins" of the Dockerfile in the repository root, which shares its application build with
# the application image (built once when both are built, as rebuild.sh does).
services:
  plugins:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: plugins
    volumes:
      - ./build:/output
