# Builds the desktop distribution (mvn package -Pdesktop) on every platform jlink/jpackage can target.
# jlink and jpackage only produce a runtime / app for the OS and CPU they run on, hence one job per platform.
#
# Artifacts per platform (downloadable from the run, attached to the release for v* tags):
#   marginalia-<version>-<os>-<arch>.tar.gz|zip       portable folder (bin/marginalia, app/, server/, runtime/)
#   marginalia-<version>-<os>-<arch>-app.tar.gz|zip   native app image (Marginalia.app / Marginalia.exe / bin/Marginalia)
#   marginalia-<version>-<os>-<arch>.deb|dmg|msi      installer (Linux / macOS / Windows), made from the app image
#   marginalia-<version>-<os>-<arch>-full.deb|dmg|msi the same with every built-in plugin inside (the plugins job
#                                                     builds the JARs once, they are the same on every platform)
#
# Installers need tools on the runner: dpkg-deb + fakeroot (Linux), hdiutil (macOS), WiX Toolset 3 (Windows); the
# GitHub images have them. The build is told to fail when an installer cannot be made (-Ddesktop.installerRequired).

name: Desktop

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    paths:
      - 'marginalia/**'
      - 'manual/user/**'
      - 'pom.xml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: marginalia

env:
  JAVA_VERSION: '25'
  MAVEN_ARGS: '-B -ntp'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-commit-id-plugin reads commit and closest tag
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Check version matches tag
        # archive names and the app version come from the POM, a release tag must not publish other version's archives
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pom_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pom_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in pom.xml ($pom_version). Set <version>$tag_version</version> and tag again."
            exit 1
          fi
          echo "Version $pom_version matches tag $GITHUB_REF_NAME"

      - name: Test
        run: mvn test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: marginalia/target/surefire-reports/
          retention-days: 7

  plugins:
    name: Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install the parent POM
        # the application's POM in the local repository refers to it, the plugins need both
        working-directory: .
        run: mvn -N install

      - name: Install the application
        # the plugins compile against the classes JAR of the application, the frontend is not needed for that
        run: mvn -DskipTests -Dvaadin.skip=true install

      - name: Build the plugins
        working-directory: marginalia/plugins
        run: |
          mkdir -p ../../plugin-jars
          for pom in */pom.xml; do
            dir=$(dirname "$pom")
            echo "::group::$dir"
            mvn -f "$pom" package
            cp "$dir"/target/*.jar ../../plugin-jars/
            echo "::endgroup::"
          done
          ls -l ../../plugin-jars

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: marginalia-plugins
          path: plugin-jars/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: [test, plugins]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Download the plugins
        # the plugin JARs for the full installer, built against this commit by the plugins job
        uses: actions/download-artifact@v4
        with:
          name: marginalia-plugins
          path: marginalia/target/desktop-plugins

      - name: Build desktop distribution
        # tests ran in the test job; quoted for PowerShell on Windows. The full installer takes the JARs of
        # target/desktop-plugins (desktop.pluginsDir)
        run: mvn "-Pdesktop" "-DskipTests" "-Ddesktop.installerRequired=true" "-Ddesktop.skipFull=false" package

      - name: Smoke test
        # the native app and the portable launcher script must start the bundled server and serve Marginalia
        shell: bash
        run: |
          smoke() {
            local name="$1" port="$2"; shift 2
            "$@" --home "$RUNNER_TEMP/home-$port" --port "$port" --no-browser --no-tray > "$RUNNER_TEMP/smoke-$port.log" 2>&1 &
            for i in $(seq 1 180); do
              if curl -s "http://127.0.0.1:$port/" | grep -q "<title>Marginalia</title>"; then
                echo "$name: Marginalia is up after ${i}s"
                return 0
              fi
              sleep 1
            done
            echo "$name: Marginalia did not start"
            cat "$RUNNER_TEMP/smoke-$port.log"
            return 1
          }
          case "$RUNNER_OS" in
            Windows) app="target/desktop/package/Marginalia/Marginalia.exe" ;;
            macOS)   app="target/desktop/package/Marginalia.app/Contents/MacOS/Marginalia" ;;
            *)       app="target/desktop/package/Marginalia/bin/Marginalia" ;;
          esac
          smoke "app image" 18765 "$app"
          if [ "$RUNNER_OS" != "Windows" ]; then
            dists=(target/desktop/marginalia-*/)
            smoke "portable" 18766 "${dists[0]}bin/marginalia"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            # both .deb packages must install and the installed app (/opt/marginalia) must start; the full one
            # brings the plugins, which the launcher copies into the extensions folder of the data directory
            plain_deb=$(ls target/desktop/marginalia-*.deb | grep -v -- '-full\.deb$')
            full_deb=$(ls target/desktop/marginalia-*-full.deb)
            port=18767
            # the package registers its menu entry with xdg-desktop-menu, which fails (exit 3) on a runner without a
            # desktop: give it the directories a desktop has
            sudo mkdir -p /usr/share/desktop-directories /usr/share/applications /etc/xdg/menus/applications-merged
            for entry in "deb:$plain_deb" "deb-full:$full_deb"; do
              name="${entry%%:*}"
              deb="${entry#*:}"
              dpkg-deb --info "$deb"
              sudo apt-get install -y "$PWD/$deb"
              smoke "$name" "$port" /opt/marginalia/bin/Marginalia
              plugin_jars=$(ls "$RUNNER_TEMP/home-$port/.marginalia/extensions/"*.jar 2>/dev/null | wc -l)
              echo "$name: $plugin_jars plugin JARs installed"
              if [ "$name" = "deb-full" ] && [ "$plugin_jars" -lt 1 ]; then
                echo "The full package did not install its plugins"
                exit 1
              fi
              if [ "$name" = "deb" ] && [ "$plugin_jars" -ne 0 ]; then
                echo "The plain package installed plugins"
                exit 1
              fi
              # the next package replaces this one
              pkill -f /opt/marginalia || true
              port=$((port + 1))
            done
          fi

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: marginalia-desktop-${{ matrix.name }}
          path: |
            marginalia/target/desktop/marginalia-*.tar.gz
            marginalia/target/desktop/marginalia-*.zip
            marginalia/target/desktop/marginalia-*.deb
            marginalia/target/desktop/marginalia-*.dmg
            marginalia/target/desktop/marginalia-*.msi
          if-no-files-found: error
          # archives are already compressed
          compression-level: 0
          retention-days: 14

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marginalia-desktop-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
